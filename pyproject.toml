[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-fix"
version = "1.0.0"
description = "Autonomous AI-Powered Android Health, Diagnostics & Performance Optimizer"
readme = "README.md"
authors = [{ name = "PhoneFix Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["android", "adb", "performance", "diagnostics", "optimization", "bloatware-remover", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.scripts]
phone-fix = "phone_fix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
